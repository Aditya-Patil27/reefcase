[project]
name = "reefcase"
version = "0.1.0"
description = "Turn a diver's reef video into a cited investigation."
requires-python = ">=3.14,<3.15"
dependencies = [
    "av>=19.0.2",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.39.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-ai>=2.61.0",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pytz>=2026.5",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "import-linter>=2.15",
  "poethepoet>=0.49",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.1",
  "pytest-recording>=0.14.0",
  "respx>=0.23.1",
  "ruff>=0.17.2",
]
# Real SAM 3 and ReefStudent weights (local CUDA, Modal, Kaggle): `uv sync --group gpu`. The gate never installs it.
gpu = [
  "segmentation-models-pytorch==0.6.0",
  "torch==2.14.1",
  "torchvision==0.29.1",  # Sam3ImageProcessor needs it
  "transformers==5.20.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.poe.tasks.gate]
help = "Full Python gate: lint, format, types, layering, tests"
sequence = [
  { cmd = "ruff check ." },
  { cmd = "ruff format --check ." },
  { cmd = "pyright" },
  { cmd = "lint-imports" },
  { cmd = 'pytest -m "not gpu and not live"' },
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["web", "ml", "var", ".scratch", ".claude", "planning", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["reefcase"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "web", "ml", "var", ".scratch"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["src/reefcase"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "gpu: needs a GPU (skipped in the gate)",
  "live: hits a real external API or service (skipped in the gate)",
]

[tool.importlinter]
root_packages = ["reefcase"]

[[tool.importlinter.contracts]]
name = "reefcase layering"
type = "layers"
containers = ["reefcase"]
layers = [
  "api | bot",
  "pipeline",
  "agent",
  "tools | llm",
  "vision | ingest",
  "store",
  "core",
]

[[tool.importlinter.contracts]]
name = "core imports only stdlib and pydantic"
type = "forbidden"
source_modules = ["reefcase.core"]
forbidden_modules = [
  "reefcase.api", "reefcase.bot", "reefcase.pipeline", "reefcase.agent",
  "reefcase.tools", "reefcase.llm", "reefcase.vision", "reefcase.ingest",
  "reefcase.store",
]
