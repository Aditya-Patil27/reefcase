[project]
name = "reefcase"
version = "0.1.0"
description = "Turn a diver's reef video into a cited investigation."
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "import-linter>=2.15",
  "poethepoet>=0.49",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-recording>=0.14.0",
  "ruff>=0.17.2",
]

[tool.poe.tasks.gate]
help = "Full Python gate: lint, format, types, layering, tests"
sequence = [
  { cmd = "ruff check ." },
  { cmd = "ruff format --check ." },
  { cmd = "pyright" },
  { cmd = "lint-imports" },
  { cmd = 'pytest -m "not gpu and not live"' },
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["web", "ml", "var", ".scratch", ".claude", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["reefcase"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "web", "ml", "var", ".scratch"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["src/reefcase"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "gpu: needs a GPU (skipped in the gate)",
  "live: hits a real external API or service (skipped in the gate)",
]

[tool.importlinter]
root_packages = ["reefcase"]

[[tool.importlinter.contracts]]
name = "reefcase layering"
type = "layers"
containers = ["reefcase"]
layers = [
  "api | bot",
  "pipeline",
  "agent",
  "tools | llm",
  "vision | ingest",
  "store",
  "core",
]

[[tool.importlinter.contracts]]
name = "core imports only stdlib and pydantic"
type = "forbidden"
source_modules = ["reefcase.core"]
forbidden_modules = [
  "reefcase.api", "reefcase.bot", "reefcase.pipeline", "reefcase.agent",
  "reefcase.tools", "reefcase.llm", "reefcase.vision", "reefcase.ingest",
  "reefcase.store",
]
